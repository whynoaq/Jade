name: Build Jade IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Available Xcode installations:"
          find /Applications -maxdepth 2 -name 'Xcode*.app' -type d | sort || true
          echo

          # Collect candidates (order matters — prefer higher versions)
          candidates=(
            /Applications/Xcode_27*.app
            /Applications/Xcode-beta.app
            /Applications/Xcode_26*.app
            /Applications/Xcode.app
          )

          XCODE_PATH=""
          SELECTED_VERSION=""

          for pattern in "${candidates[@]}"; do
            for candidate in $pattern; do
              if [ ! -d "$candidate/Contents/Developer" ]; then
                continue
              fi

              VERSION=$(
                DEVELOPER_DIR="$candidate/Contents/Developer" \
                xcodebuild -version 2>/dev/null |
                awk '/^Xcode / {print $2; exit}' || true
              )

              echo "  found: $candidate → Xcode ${VERSION:-unknown}"

              # Prefer any 27.x
              if [[ "${VERSION:-}" == 27* ]]; then
                XCODE_PATH="$candidate"
                SELECTED_VERSION="$VERSION"
                break 2
              fi

              # Fallback: accept 26.x if nothing better yet
              if [[ -z "$XCODE_PATH" && "${VERSION:-}" == 26* ]]; then
                XCODE_PATH="$candidate"
                SELECTED_VERSION="$VERSION"
              fi
            done
          done

          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No suitable Xcode found (need 26+ or 27)."
            echo "Available versions above. Check the runner image or install Xcode."
            exit 1
          fi

          echo
          echo "==> Selecting: $XCODE_PATH (Xcode $SELECTED_VERSION)"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | head -20 || true

      - name: Validate project
        run: |
          test -d Jade.xcodeproj
          xcodebuild -list -project Jade.xcodeproj

      - name: Build Jade
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          xcodebuild build \
            -project Jade.xcodeproj \
            -scheme Jade \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package standard Jade IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/Jade.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Jade.app was not produced."
            find build/DerivedData/Build/Products \
              -name '*.app' -print
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Jade.app

          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleIdentifier com.jason.Jade' \
            build/ipa/Payload/Jade.app/Info.plist

          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleDisplayName Jade' \
            build/ipa/Payload/Jade.app/Info.plist

          (
            cd build/ipa
            /usr/bin/zip -r -q ../Jade.ipa Payload
          )

          ls -lh build/Jade.ipa

      - name: Upload Jade IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: build/Jade.ipa
          if-no-files-found: error
          retention-days: 7
